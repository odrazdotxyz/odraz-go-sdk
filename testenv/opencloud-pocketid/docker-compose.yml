# OpenCloud trusting Pocket ID as its external OIDC provider (host networking, so both
# see the issuer as http://localhost:1411). Stop testenv/opencloud and testenv/pocketid first
# (same ports). OpenCloud: https://localhost:9200 (self-signed), Pocket ID: http://localhost:1411.
services:
  pocketid:
    image: ghcr.io/pocket-id/pocket-id:v2
    network_mode: host
    environment:
      APP_URL: http://localhost:1411
      ENCRYPTION_KEY: odraz-test-encryption-key-0123456789abcdef
      STATIC_API_KEY: odraz-test-static-api-key-0123456789
      TRUST_PROXY: "false"
      ANALYTICS_DISABLED: "true"
      VERSION_CHECK_DISABLED: "true"
      DISABLE_RATE_LIMITING: "true"
    tmpfs: ["/app/data:uid=1000,gid=1000"]
  opencloud:
    image: opencloudeu/opencloud-rolling:latest
    network_mode: host
    depends_on: [pocketid]
    entrypoint: ["/bin/sh", "-c", "opencloud init --admin-password admin --insecure yes || true; opencloud server"]
    environment:
      OC_URL: https://localhost:9200
      OC_INSECURE: "true"
      OC_LOG_LEVEL: info
      PROXY_HTTP_ADDR: 0.0.0.0:9200
      # external identity provider instead of the built-in one
      OC_EXCLUDE_RUN_SERVICES: idp
      OC_OIDC_ISSUER: http://localhost:1411
      PROXY_OIDC_ISSUER: http://localhost:1411
      PROXY_OIDC_REWRITE_WELLKNOWN: "true"
      PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD: jwt
      PROXY_USER_OIDC_CLAIM: preferred_username
      PROXY_USER_CS3_CLAIM: username
      PROXY_AUTOPROVISION_ACCOUNTS: "true"
      PROXY_AUTOPROVISION_CLAIM_USERNAME: preferred_username
      PROXY_AUTOPROVISION_CLAIM_EMAIL: email
      PROXY_AUTOPROVISION_CLAIM_DISPLAYNAME: name
      PROXY_ROLE_ASSIGNMENT_DRIVER: default
      GRAPH_ASSIGN_DEFAULT_USER_ROLE: "true"
      GRAPH_USERNAME_MATCH: none
      WEB_OIDC_CLIENT_ID: opencloud-web
      WEB_OIDC_AUTHORITY: http://localhost:1411
      WEB_OIDC_METADATA_URL: http://localhost:1411/.well-known/openid-configuration
      WEB_OIDC_SCOPE: openid profile email
    tmpfs: ["/etc/opencloud:uid=1000,gid=1000", "/var/lib/opencloud:uid=1000,gid=1000"]
