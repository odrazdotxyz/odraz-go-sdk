# nginx fake auth proxy in front of the Apache WebDAV test server.
# Without header "X-Proxy-Token: secret" it behaves like a login gateway:
#   :8082  302 to a login page on ANOTHER host (localhost:8083)   -> ErrBlockedByProxy (redirect)
#   :8085  302 to /login on the SAME host, which serves HTML      -> ErrBlockedByProxy (HTML)
#   :8086  200 with an HTML login page straight away              -> ErrBlockedByProxy (HTML)
#   :8083  the fake login page itself
# With the header, every port forwards to WebDAV (user odraz / odraz-test), base path /dav/.
services:
  webdav:
    build: ../webdav
    tmpfs: ["/var/dav:uid=33,gid=33"]
  proxy:
    image: nginx:alpine
    depends_on: [webdav]
    ports: ["8082:8082", "8083:8083", "8085:8085", "8086:8086"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
