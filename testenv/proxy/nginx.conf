events {}
http {
  map $http_x_proxy_token $authed { default 0; "secret" 1; }

  server { # cross-host redirect to a login page
    listen 8082;
    client_max_body_size 0;
    location / {
      if ($authed = 0) { return 302 http://localhost:8083/login; }
      proxy_pass http://webdav:80;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_set_header Host $http_host;
    }
  }

  server { # same-host redirect to an HTML login page
    listen 8085;
    client_max_body_size 0;
    location = /login { default_type text/html; return 200 "<!doctype html><html><body>Please sign in</body></html>"; }
    location / {
      if ($authed = 0) { return 302 /login; }
      proxy_pass http://webdav:80;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_set_header Host $http_host;
    }
  }

  server { # HTML straight away, no redirect
    listen 8086;
    client_max_body_size 0;
    location / {
      default_type text/html;
      if ($authed = 0) { return 200 "<!doctype html><html><body>Please sign in</body></html>"; }
      proxy_pass http://webdav:80;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_set_header Host $http_host;
    }
  }

  server { # the fake login host
    listen 8083;
    location / { default_type text/html; return 200 "<!doctype html><html><body>Login</body></html>"; }
  }
}
