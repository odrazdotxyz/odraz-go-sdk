# Pocket ID (passkey-only OIDC provider) for OIDC tests. http://localhost:1411
# Admin API key (header X-API-KEY): odraz-test-static-api-key-0123456789
services:
  pocketid:
    image: ghcr.io/pocket-id/pocket-id:v2
    ports: ["1411:1411"]
    environment:
      APP_URL: http://localhost:1411
      ENCRYPTION_KEY: odraz-test-encryption-key-0123456789abcdef
      STATIC_API_KEY: odraz-test-static-api-key-0123456789
      TRUST_PROXY: "false"
      ANALYTICS_DISABLED: "true"
      VERSION_CHECK_DISABLED: "true"
      DISABLE_RATE_LIMITING: "true"
      LOG_LEVEL: info
    tmpfs: ["/app/data:uid=1000,gid=1000"]   # fresh state on every `up`
