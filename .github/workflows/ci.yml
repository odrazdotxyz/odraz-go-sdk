name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x', check-latest: true} # the latest patch: go.mod names the minimum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  # The S3 adapter against real servers in containers. No secrets: the credentials are the throwaway ones in testenv.
  s3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [minio, seaweedfs, garage]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x', check-latest: true} # the latest patch: go.mod names the minimum
      - name: conformance and real-server tests
        run: |
          vars=$(testenv/${{ matrix.server }}/seed.sh)
          eval "$vars"
          go test -race -count=1 -v ./drivers/s3/
